name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']        # 17 是基线；21 额外编译 src/main/java21（第 27 章）
    defaults:
      run:
        working-directory: java17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: 编译并运行测试
        run: mvn -B -ntp verify

  docs:
    name: 文档链接检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查站内链接和锚点
        run: python3 .github/scripts/check_links.py docs
